name: Build and test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: windows-latest
            preset: windows-debug
          - os: ubuntu-latest
            preset: linux-debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap-windows.ps1
      - name: Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      - run: npm ci
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
      - run: npm test
        working-directory: viewer
      - name: Browser tests
        if: runner.os == 'Linux'
        working-directory: viewer
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
